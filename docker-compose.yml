version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: banking-chatbot-backend
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./configs:/app/configs
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8000
    container_name: banking-chatbot-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: always

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: banking-chatbot-streamlit
    ports:
      - "8501:8501"
    volumes:
      - ./models:/app/models
      - ./configs:/app/configs
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
    command: streamlit run app/app.py --server.port=8501 --server.address=0.0.0.0 --server.headless=true --browser.gatherUsageStats=false
    depends_on:
      - backend
    restart: always
